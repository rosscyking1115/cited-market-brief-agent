[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cited-market-brief-agent-api"
version = "1.0.0"
description = "Cited Market Brief Agent API - audit-ready public-data brief engine"
authors = [{ name = "Cheng-Yuan King", email = "rosscyking1115@gmail.com" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136",
    "starlette>=1.3.1",      # PYSEC-2026-249 (transitive via fastapi)
    "uvicorn[standard]>=0.34",
    "pydantic>=2.13",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4.2,<0.5",  # Python adapter; DB extension stays pinned at pgvector >=0.8.2
    "httpx>=0.28",
    "litellm>=1.88.1",       # supply-chain incident in 1.82.7/1.82.8 — do not lower
    "edgartools>=4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "croniter>=3.0",
    "python-pptx>=1.0",      # core exports (PPTX); flagged low-maintenance but stable
    "openpyxl>=3.1.5",       # core exports (XLSX) with formula-injection escaping
    "pyjwt[crypto]>=2.10",   # OIDC bearer-token validation via JWKS
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.15",             # narrow type gate; perimeter defined in [tool.mypy] below
    "hatchling>=1.27",        # tests/test_sdist_contents.py BUILDS the sdist to inspect it.
                              # Named here so its absence is a test ERROR, not a skip: a
                              # packaging control that quietly skips is not a control.
]
parsing = [
    "docling>=2.15",         # IR PDFs (Phase 1+); EDGAR uses edgartools
]
exports = [
    "playwright>=1.50",      # PDF (sandboxed: JS + network disabled); run: playwright install chromium
]
s3 = [
    "boto3>=1.35",           # raw source store on S3/MinIO (dev default is local FS)
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# An ALLOWLIST, not an exclude list, and the distinction is the whole point.
#
# An sdist is built from the DIRECTORY, not from the git index. With no selection
# declared, hatchling packages everything the ignore files do not name — which is
# an exclude list, and an exclude list FAILS OPEN: the next local-only directory
# to appear here is published silently, because nobody thought to name it. An
# allowlist FAILS CLOSED: anything not named below is absent from the artifact
# until someone adds it deliberately.
#
# This is not hypothetical here. The repository's .gitignore lives one level up,
# at the repo root, and covers .venv/, .data/, .pytest_cache/ and .ruff_cache/ —
# so the sdist looked clean. But .mypy_cache/ is not in that file; it stayed out
# only because mypy happens to write its own self-ignoring .gitignore. Nothing
# the project controls excluded it. A probe that dropped three untracked files
# into this directory saw the selection go from 122 files to 125, including a
# dot-directory carrying an absolute machine path.
#
# tests/test_sdist_contents.py enforces this, and its strongest assertion is that
# every member of the BUILT sdist is tracked by git — a rule that needs no list of
# what anyone's local tooling is called, because local-only files are untracked by
# construction.
[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/tests",
    "/scripts",
    "/alembic",
    "/alembic.ini",
    "/Dockerfile",
    "/.dockerignore",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "D2", "D4"]
# S101: assert in tests. UP042: StrEnum would change SQLAlchemy enum str() semantics.
#
# D205 (blank line between summary and description) is off for now, and this is a
# recorded gap rather than a decision. 41 existing docstrings open with a summary
# that wraps onto a second line. Fixing them means rewriting each summary to stand
# alone, which is editorial work worth doing deliberately — not a mechanical sweep
# folded into an unrelated change. Turn it on when someone has the appetite.
ignore = ["S101", "UP042", "D205"]

# Google style, recorded here so the linter and any doc generator agree. Chosen
# because it stays readable for short functions, which is most of this codebase.
#
# D1 (missing-docstring) is deliberately NOT enabled. A docstring written to
# satisfy a linter costs maintenance and teaches readers that docstrings here are
# noise; D2 and D4 are on, so every docstring that does exist is well formed.
# What to document, in priority order: the public surface, then anything with a
# non-obvious contract, then anything whose name could mislead, then module
# docstrings for the modules a reader opens first.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends()/Query() in signature defaults are idiomatic (B008).
"app/api/routes/*" = ["B008"]
# S603: the type-gate test shells out to `sys.executable -m mypy` with a
# literal argv and a tmp_path it wrote itself — no untrusted input involved.
"tests/test_type_gate.py" = ["S603"]
# S603/S607: the packaging test asks git what it tracks. The argv is literal
# apart from a member name read out of an sdist this test just built itself, and
# resolving `git` on PATH is the point — the check must run wherever CI does.
"tests/test_sdist_contents.py" = ["S603", "S607"]

[tool.mypy]
# Deliberately NARROW perimeter, not a whole-codebase gate.
#
# Scope rule: the modules where a type error would corrupt a REPORTED NUMBER —
# the citation validator, the eval scoring path, and the script that prints the
# figures. Everything else in the backend is annotated but unchecked, and no
# claim anywhere asserts otherwise (docs/EVAL_METHODOLOGY.md, "Limits").
#
# The whole perimeter passed --strict with zero errors on first run, so this
# gate cost nothing to adopt and starts clean. Widening it is cheap; do that
# module by module rather than flipping it on repo-wide and adding overrides.
python_version = "3.13"
strict = true
files = [
    "app/briefs/validator.py",
    "app/briefs/consistency.py",
    "app/briefs/guardrails.py",
    "app/briefs/schemas.py",
    "app/evals",
    "scripts/run_evals.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
